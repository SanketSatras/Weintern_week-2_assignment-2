$kind: http-request
description: Performs case-insensitive regex search matching name, department, or job role.
url: "{{baseUrl}}/employees?search=Engineer"
method: GET
headers:
  Accept: application/json
queryParams:
  search: Engineer
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Search returns matching records', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.data).to.be.an('array');
      });
    language: text/javascript
order: 4000
