$kind: http-request
description: Permanently deletes the employee record from MongoDB.
url: "{{baseUrl}}/employees/{{employeeId}}"
method: DELETE
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response confirms employee deletion', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.data.id).to.eql(pm.collectionVariables.get('employeeId'));
      });
    language: text/javascript
order: 8000
